name: Feature request
description: Suggest something
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. It often has a shorter answer than expected.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: false

  - type: input
    id: backend
    attributes:
      label: Which backend or provider does this concern
      description: Leave blank if it is not specific to one.
